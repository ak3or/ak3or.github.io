name: Deploy AK3OR Digital Hub to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build site and configure Supabase
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_URL}" ]]; then
            echo "::error::Missing repository variable SUPABASE_URL. Add it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

          if [[ -z "${SUPABASE_PUBLISHABLE_KEY}" ]]; then
            echo "::error::Missing repository variable SUPABASE_PUBLISHABLE_KEY. Add it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          source = Path("index.html")
          if not source.is_file():
              raise SystemExit("::error::index.html was not found in the repository root. Upload it beside the .github folder.")

          html = source.read_text(encoding="utf-8")
          supabase_url = os.environ["SUPABASE_URL"].strip()
          publishable_key = os.environ["SUPABASE_PUBLISHABLE_KEY"].strip()

          if not supabase_url.startswith("https://") or ".supabase.co" not in supabase_url:
              raise SystemExit("::error::SUPABASE_URL must be your HTTPS Supabase project URL.")
          if len(publishable_key) < 20:
              raise SystemExit("::error::SUPABASE_PUBLISHABLE_KEY looks empty or incomplete.")

          # Replace the value assigned to each JS constant. This works whether
          # index.html still has the YOUR_* placeholder or already has an older value.
          replacements = {
              "SUPABASE_URL": supabase_url,
              "SUPABASE_PUBLISHABLE_KEY": publishable_key,
          }

          for variable, value in replacements.items():
              pattern = re.compile(
                  rf"(const\s+{re.escape(variable)}\s*=\s*)(['\"]).*?\2(\s*;)",
                  re.DOTALL,
              )
              html, count = pattern.subn(
                  lambda match, value=value: match.group(1) + json.dumps(value) + match.group(3),
                  html,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(
                      f"::error::Could not find exactly one JavaScript declaration for {variable} in index.html. "
                      "Make sure the original AK3OR index.html is in the repository root."
                  )

          output = Path("_site")
          if output.exists():
              import shutil
              shutil.rmtree(output)
          output.mkdir(parents=True)
          (output / "index.html").write_text(html, encoding="utf-8")
          (output / ".nojekyll").touch()
          print("Built _site/index.html and configured Supabase successfully.")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
