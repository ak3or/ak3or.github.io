name: Deploy AK3OR Digital Hub to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static website and configure Supabase
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_URL}" ]]; then
            echo "Missing GitHub Actions variable: SUPABASE_URL"
            exit 1
          fi

          if [[ -z "${SUPABASE_PUBLISHABLE_KEY}" ]]; then
            echo "Missing GitHub Actions variable: SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi

          mkdir -p _site

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path("index.html")
          if not source.is_file():
              raise SystemExit("index.html was not found in the repository root.")

          html = source.read_text(encoding="utf-8")
          supabase_url = os.environ["SUPABASE_URL"].strip()
          publishable_key = os.environ["SUPABASE_PUBLISHABLE_KEY"].strip()

          if not supabase_url.startswith("https://"):
              raise SystemExit("SUPABASE_URL must be your HTTPS Supabase project URL.")

          if "YOUR_SUPABASE_URL" not in html:
              raise SystemExit("The YOUR_SUPABASE_URL placeholder was not found in index.html.")
          if "YOUR_SUPABASE_PUBLISHABLE_KEY" not in html:
              raise SystemExit("The YOUR_SUPABASE_PUBLISHABLE_KEY placeholder was not found in index.html.")

          html = html.replace("'YOUR_SUPABASE_URL'", json.dumps(supabase_url), 1)
          html = html.replace("'YOUR_SUPABASE_PUBLISHABLE_KEY'", json.dumps(publishable_key), 1)

          if "YOUR_SUPABASE_URL" in html or "YOUR_SUPABASE_PUBLISHABLE_KEY" in html:
              raise SystemExit("A Supabase placeholder is still present. Check index.html.")

          Path("_site/index.html").write_text(html, encoding="utf-8")
          print("Built _site/index.html with the Supabase project URL and publishable key.")
          PY

          # GitHub Pages should not process the published folder with Jekyll.
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
