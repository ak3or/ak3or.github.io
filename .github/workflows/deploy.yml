name: Deploy AK3OR Digital Hub to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build site and configure Supabase
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_URL}" ]]; then
            echo "::error::Missing repository variable SUPABASE_URL. Add it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

          if [[ -z "${SUPABASE_PUBLISHABLE_KEY}" ]]; then
            echo "::error::Missing repository variable SUPABASE_PUBLISHABLE_KEY. Add it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path("index.html")
          if not source.is_file():
              raise SystemExit("::error::index.html was not found in the repository root.")

          html = source.read_text(encoding="utf-8")
          supabase_url = os.environ["SUPABASE_URL"].strip()
          publishable_key = os.environ["SUPABASE_PUBLISHABLE_KEY"].strip()

          if not supabase_url.startswith("https://") or ".supabase.co" not in supabase_url:
              raise SystemExit("::error::SUPABASE_URL does not look like an HTTPS Supabase project URL.")
          if len(publishable_key) < 20:
              raise SystemExit("::error::SUPABASE_PUBLISHABLE_KEY looks empty or incomplete.")
          if "YOUR_SUPABASE_URL" not in html:
              raise SystemExit("::error::The YOUR_SUPABASE_URL placeholder was not found in index.html.")
          if "YOUR_SUPABASE_PUBLISHABLE_KEY" not in html:
              raise SystemExit("::error::The YOUR_SUPABASE_PUBLISHABLE_KEY placeholder was not found in index.html.")

          html = html.replace("'YOUR_SUPABASE_URL'", json.dumps(supabase_url), 1)
          html = html.replace("'YOUR_SUPABASE_PUBLISHABLE_KEY'", json.dumps(publishable_key), 1)

          if "YOUR_SUPABASE_URL" in html or "YOUR_SUPABASE_PUBLISHABLE_KEY" in html:
              raise SystemExit("::error::A Supabase placeholder is still present after configuration.")

          output = Path("_site")
          output.mkdir(exist_ok=True)
          (output / "index.html").write_text(html, encoding="utf-8")
          (output / ".nojekyll").touch()
          print("Built _site/index.html successfully.")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
